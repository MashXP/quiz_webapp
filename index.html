<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" integrity="sha384-wcIxkf4k558AjM3Yz3BBFQUbk/zgIYC2R0QpeeYb+TwlBVMrlgLqwRjRtGZiK7ww" crossorigin="anonymous">
</head>
<body>
    <div id="app-container" class="hide">
        <div id="vertical-progress-bar"></div>
        <div id="main-content">
            <button id="toggle-progress-btn" class="quiz-btn"><span id="progress-arrow"></span></button>
            <div id="quiz-wrapper">
                <div id="question-header">
                    <h1>Quiz App</h1>
                    <div id="quiz-file-name" class="quiz-file-info"></div>
                    <div id="question-counter"></div>
                </div>
                <div id="question-container">
                    <p id="question-text"></p>
                    <div id="options-container"></div>
                </div>
                <div style="text-align: center;">
                    <button id="flag-btn" class="quiz-btn">🚩</button>
                    <button id="next-btn" class="quiz-btn hide">Next</button>
                    <button id="submit-btn" class="quiz-btn hide">Submit All</button>
                </div>
                <div id="results-container" class="hide">
                    <h2>Quiz Complete!</h2>
                    <div class="score-container">
                         <div class="score-display">
                            <span id="score"></span><span class="score-divider">/</span><span id="total-questions"></span>
                        </div>
                        <p class="score-message">Your Score</p>
                    </div>
                    <div style="margin-bottom: 15px; text-align: center;">
                        <label style="cursor: pointer; display: inline-flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="filter-incorrect-checkbox"> 
                            Show Only Incorrect Answers
                        </label>
                    </div>
                    <div id="detailed-results"></div>
                    <div style="text-align: center;">
                        <button id="restart-btn" class="quiz-btn">Restart Quiz</button>
                        <button id="download-btn" class="quiz-btn">Download Results</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="initial-setup-wrapper">
        <div id="initial-setup-container">
            <div id="drop-zone-container">
                 <div id="drop-zone">
                    <h2>Drag & Drop quiz.json file here</h2>
                                <label for="file-upload" class="custom-file-upload">
                                    Click to Upload
                                </label>
                                <input id="file-upload" type="file" accept=".json">
                                <div id="quiz-options">
                                    <label style="display: block; margin-bottom: 10px; cursor: pointer;">
                                        <input type="checkbox" id="shuffle-questions-checkbox">
                                        Shuffle Questions
                                    </label>                    <label style="display: block; cursor: pointer;">
                            <input type="checkbox" id="shuffle-choices-checkbox" checked>
                            Shuffle Choices
                        </label>
                        <label style="display: block; margin-top: 10px; cursor: pointer;">
                            <input type="checkbox" id="delayed-feedback-checkbox">
                            Reveal answers after submission
                        </label>
                        <label style="display: block; margin-top: 10px; cursor: pointer;">
                            <input type="checkbox" id="auto-move-checkbox">
                            Auto move to next question
                        </label>
                    </div>
                </div>
            </div>

            <div class="separator">OR</div>

            <div id="universal-input-area">
                <h2>Paste Quiz JSON or GitHub URL</h2>
                <textarea id="universal-input" placeholder='Paste JSON here: [{"question": "Example Q?", "answer": "A", "options": ["A", "B"]}]&#10;Or GitHub URL here: https://github.com/owner/repo/tree/branch/path'></textarea>
                <button id="universal-load-btn" class="quiz-btn">Load</button>
            </div>

            <div id="recommended-quizzes-container">
            </div>
            <div id="hot-directory-list-container"></div>
        </div>
    </div>

    <div id="footer-info">
        <a href="https://github.com/MashXP/quiz_webapp" target="_blank" rel="noopener noreferrer" id="github-link">
            <svg height="16" viewBox="0 0 16 16" version="1.1" width="16" aria-hidden="true" fill="currentColor"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 01-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 010 8c0-4.42 3.58-8 8-8Z"></path></svg>
            <span id="version-display"></span>
        </a>
    </div>
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/render.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/results.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/events.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" integrity="sha384-hIoBPJpTUs74ddyc4bFZSM1TVlQDA60VBbJS0oA934VSz82sBx1X7kSx2ATBDIyd" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
</body>
</html>
